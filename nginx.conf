server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Proxy API calls to backend to keep same-origin requests in production.
    location /api/ {
        proxy_pass https://puntoventa-api.nonamesystems.com;
        proxy_ssl_server_name on;
        proxy_set_header Host puntoventa-api.nonamesystems.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1. Redirigir la raíz exacta "/" a "/es-MX/"
    location = / {
        return 301 /es-MX/;
    }

    # 2. Manejar la aplicación en la carpeta es-MX
    location /es-MX/ {
        try_files $uri $uri/ /es-MX/index.html;
    }

    # 3. Redirigir cualquier otra ruta que no empiece con /es-MX/
    # Ejemplo: si alguien entra a /products, lo manda a /es-MX/products
    location / {
        return 301 /es-MX$request_uri;
    }
}
