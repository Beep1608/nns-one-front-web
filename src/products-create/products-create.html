<app-page-header
  title="Create Product"
  subtitle="Add a new item to your inventory with pricing and stock details."
  [showBack]="true"
  (back)="goBack()"></app-page-header>

<div class="px-4 pb-8 sm:px-6">
  <app-card [narrow]="true">
    <form [formGroup]="validateForm" (ngSubmit)="submitForm()" class="space-y-6">
      <div class="space-y-2">
        <label for="product-name" class="block text-sm font-medium text-slate-700">Product name</label>
        <input
          id="product-name"
          type="text"
          formControlName="name"
          placeholder="e.g. MacBook Pro 14"
          class="w-full rounded-xl border bg-white px-3.5 py-2.5 text-sm text-slate-800 outline-none transition placeholder:text-slate-400"
          [class.border-red-300]="isInvalid('name')"
          [class.ring-2]="isInvalid('name')"
          [class.ring-red-100]="isInvalid('name')"
          [class.border-slate-300]="!isInvalid('name')"
          [class.focus:border-primary-400]="!isInvalid('name')"
          [class.focus:ring-primary-100]="!isInvalid('name')" />
        @if (isInvalid('name')) {
          <p class="text-xs font-medium text-red-600">Product name is required.</p>
        }
      </div>

      <div class="grid gap-4 sm:grid-cols-2">
        <div class="space-y-2">
          <label for="product-price" class="block text-sm font-medium text-slate-700">Price</label>
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-sm text-slate-400">$</span>
            <input
              id="product-price"
              type="number"
              min="0"
              step="0.01"
              formControlName="price"
              placeholder="0.00"
              class="w-full rounded-xl border bg-white py-2.5 pl-8 pr-3.5 text-sm text-slate-800 outline-none transition placeholder:text-slate-400"
              [class.border-red-300]="isInvalid('price')"
              [class.ring-2]="isInvalid('price')"
              [class.ring-red-100]="isInvalid('price')"
              [class.border-slate-300]="!isInvalid('price')"
              [class.focus:border-primary-400]="!isInvalid('price')"
              [class.focus:ring-primary-100]="!isInvalid('price')" />
          </div>
          @if (isInvalid('price')) {
            <p class="text-xs font-medium text-red-600">Price must be a positive number.</p>
          }
        </div>

        <div class="space-y-2">
          <label for="product-stock" class="block text-sm font-medium text-slate-700">Initial stock</label>
          <input
            id="product-stock"
            type="number"
            min="0"
            step="1"
            formControlName="stock"
            placeholder="Quantity"
            class="w-full rounded-xl border bg-white px-3.5 py-2.5 text-sm text-slate-800 outline-none transition placeholder:text-slate-400"
            [class.border-red-300]="isInvalid('stock')"
            [class.ring-2]="isInvalid('stock')"
            [class.ring-red-100]="isInvalid('stock')"
            [class.border-slate-300]="!isInvalid('stock')"
            [class.focus:border-primary-400]="!isInvalid('stock')"
            [class.focus:ring-primary-100]="!isInvalid('stock')" />
          @if (isInvalid('stock')) {
            <p class="text-xs font-medium text-red-600">Stock must be zero or greater.</p>
          }
        </div>
      </div>

      <div class="space-y-2">
        <label for="product-description" class="block text-sm font-medium text-slate-700">Description</label>
        <textarea
          id="product-description"
          rows="4"
          formControlName="description"
          placeholder="Product specifications or details..."
          class="w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-primary-400 focus:ring-2 focus:ring-primary-100">
        </textarea>
      </div>

      <div class="flex flex-wrap justify-end gap-3 border-t border-slate-200 pt-5">
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-xl border border-slate-300 bg-white px-4 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
          (click)="goBack()">
          <i class="fa-solid fa-arrow-left text-xs"></i>
          Cancel
        </button>
        <button
          type="submit"
          class="inline-flex items-center gap-2 rounded-xl bg-primary-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm shadow-primary-700/30 transition hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-60"
          [disabled]="validateForm.invalid || submitting()">
          <i class="fa-solid fa-plus"></i>
          {{ submitting() ? 'Creating...' : 'Create Product' }}
        </button>
      </div>
    </form>
  </app-card>
</div>
