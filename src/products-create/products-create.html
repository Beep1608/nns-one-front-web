<div class="container">
  <div class="header">
    <h1>Create Product</h1>
    <p>Enter the required details to add a new item to the inventory.</p>
  </div>
  <div>
     <form  nz-form [formGroup]="validateForm" (ngSubmit)="submitForm()" nzLayout="vertical">


    <nz-form-item>
      <nz-form-label nzRequired>Product Name</nz-form-label>
      <nz-form-control nzErrorTip="Please enter the product name">
        <input nz-input formControlName="name" placeholder="e.g. MacBook Pro 14" />
      </nz-form-control>
    </nz-form-item>

    <div class="row-flex">
      <nz-form-item class="flex-1">
        <nz-form-label nzRequired>Price</nz-form-label>
        <nz-form-control nzErrorTip="Enter a valid price">
          <nz-input-number
            formControlName="price"
            [nzMin]="0"
            [nzStep]="0.01"
            nzPlaceHolder="0.00"
            class="w-full">
          </nz-input-number>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item class="flex-1">
        <nz-form-label nzRequired>Initial Stock</nz-form-label>
        <nz-form-control nzErrorTip="Minimum 0 units">
          <nz-input-number
            formControlName="stock"
            [nzMin]="0"
            nzPlaceHolder="Qty"
            class="w-full">
          </nz-input-number>
        </nz-form-control>
      </nz-form-item>
    </div>

    <nz-form-item>
      <nz-form-label>Description</nz-form-label>
      <nz-form-control>
        <textarea
          nz-input
          formControlName="description"
          placeholder="Product specifications or details..."
          [nzAutosize]="{ minRows: 3, maxRows: 6 }">
        </textarea>
      </nz-form-control>
    </nz-form-item>

    <button nz-button nzType="primary" nzBlock [disabled]="!validateForm.valid">
      Create Product
    </button>

    <nz-form-item>
      <nz-form-label i18n>Product Image</nz-form-label>
      <nz-form-control>
        <nz-upload
          nzType="drag"
          [nzMultiple]="false"
          [nzBeforeUpload]="beforeUpload"
          [(nzFileList)]="fileList"
          nzLimit="1"
          class="product-uploader"
        >
          <p class="ant-upload-drag-icon">
            <span nz-icon nzType="inbox"></span>
          </p>
          <p class="ant-upload-text">Click or drag image to this area to upload</p>
          <p class="ant-upload-hint">Support for a single upload. Max size 2MB.</p>
        </nz-upload>
      </nz-form-control>
    </nz-form-item>
  </form>
  </div>

</div>
